<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>
    <meta name="author" content="Alejandro Rojas, Tania Casanova, Sheelsyn Garcia">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="fondo-login">

    <a class="atras" href="login.html"><i class="fa-solid fa-chevron-left"></i></a>

    <div class="tarjeta">
        <h2>Recupera tu contraseña</h2>
        <p class="subtitulo">Escribe tu usuario y la nueva contraseña.</p>

        <label>Usuario</label>
        <input class="inputs" type="text" id="usuario" placeholder="Ej: arojas">
        <label>Nueva contraseña</label>
        <input class="inputs" type="password" id="nueva" placeholder="Minimo 6 caracteres">
        <label>Confirmar contraseña</label>
        <input class="inputs" type="password" id="confirmar" placeholder="Repite la contraseña">

        <p id="mensaje"></p>

        <button class="btn-naranja" onclick="recuperar()">Cambiar <i class="fa-solid fa-arrow-pointer"></i></button>

        <p class="pie-tarjeta">¿Ya la recordaste? <a href="login.html">Volver a iniciar sesión</a></p>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
