<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <meta name="author" content="Alejandro Rojas, Tania Casanova, Sheelsyn Garcia">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="fondo-login">

    <a class="atras" href="login.html"><i class="fa-solid fa-chevron-left"></i></a>

    <div class="tarjeta">
        <h2>Crea tu cuenta</h2>
        <p class="subtitulo">Regístrate para poder usar las calculadoras.</p>

        <label>Nombre</label>
        <input class="inputs" type="text" id="nombre" placeholder="Ej: Alejandro Rojas">
        <label>Usuario</label>
        <input class="inputs" type="text" id="usuario" placeholder="Ej: arojas">
        <label>Contraseña</label>
        <input class="inputs" type="password" id="contrasena" placeholder="Minimo 6 caracteres" maxlength="25" minlength="6" pattern="{6,25}" required>

        <p id="mensaje"></p>

        <button class="btn-naranja" onclick="registrar()">Registrarme <i class="fa-solid fa-arrow-pointer"></i></button>

        <p class="pie-tarjeta">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
