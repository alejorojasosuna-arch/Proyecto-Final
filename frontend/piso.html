<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piso</title>
    <meta name="author" content="Alejandro Rojas, Tania Casanova, Sheelsyn Garcia">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>

<body onload="verificarSesion()">

    <a class="atras" href="menu.html"><i class="fa-solid fa-chevron-left"></i></a>

    <div class="banner piso izquierda">
        <img src="img/piso.png">
        <h2>Piso</h2>
    </div>

    <div class="calculadora">
        <div class="datos">
            <h2>Calcular Pisos</h2>
            <p class="subtitulo">Completa los datos y presiona Calcular.</p>

            <label>Ancho del paño (m)</label>
            <input class="inputs" type="number" id="ancho" placeholder="Ej: 4">
            <label>Largo del paño (m)</label>
            <input class="inputs" type="number" id="largo" placeholder="Ej: 5">

            <p id="mensaje"></p>

            <button class="btn-crema" onclick="calcularPiso()">Calcular <i class="fa-solid fa-arrow-pointer"></i></button>
        </div>

        <div class="resultados">
            <h3>Resultado</h3>
            <p>Superficie total (+10%): <span id="resPiso">0</span> m²</p>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
