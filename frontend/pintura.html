<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pintura</title>
    <meta name="author" content="Alejandro Rojas, Tania Casanova, Sheelsyn Garcia">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>

<body onload="verificarSesion()">

    <a class="atras" href="menu.html"><i class="fa-solid fa-chevron-left"></i></a>

    <div class="banner pintura derecha">
        <h2>Pintura</h2>
        <img src="img/pintura.png">
    </div>

    <div class="calculadora">
        <div class="datos">
            <h2>Calcular Pintura</h2>
            <p class="subtitulo">Completa los datos y presiona Calcular.</p>

            <label>Superficie del muro (m²)</label>
            <input class="inputs" type="number" id="superficie" placeholder="Ej: 20">

            <p id="mensaje"></p>

            <button class="btn-crema" onclick="calcularPintura()">Calcular <i class="fa-solid fa-arrow-pointer"></i></button>
        </div>

        <div class="resultados">
            <h3>Resultado</h3>
            <p>Pintura necesaria: <span id="resPintura">0</span> litros</p>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
